name: Pawdly
description: Pawdly (포들리) is a South Korean pet e-commerce marketplace and mobile app operated
  by KCC I&C, offering pet product shopping across categories, saved/wishlist items, and pet-care
  service reservations, alongside pet-care tips and member benefits delivered through its app. KCC
  I&C operates as a payment intermediary and mail-order sales broker rather than the direct seller,
  with individual merchants fulfilling orders, shipping, and refunds. Pawdly was surfaced as a
  portfolio company of 500 Global and added to the API Evangelist network. An enrichment pass found
  a consumer web/mobile marketplace with no public developer portal, API, or documentation surface.
